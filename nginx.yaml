apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rbomfimpro/k8s-apps-v3
    path: apps
    targetRevision: HEAD
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  info:
    - name: repo
      value: https://github.com/rbomfimpro/k8s-apps-v3
    - name: team
      value: SRE
